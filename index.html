<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>ONNREV — Building What Moves Tomorrow.</title>
  <meta name="description"
    content="ONNREV builds technology, design and solutions for businesses ready for what's next. Premium corporate technology company." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://onnrev.com/" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#000000" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://onnrev.com/" />
  <meta property="og:site_name" content="ONNREV" />
  <meta property="og:title" content="ONNREV — Building What Moves Tomorrow." />
  <meta property="og:description"
    content="Technology, design and solutions built for businesses ready for what's next. Engineering resilient digital systems and autonomous architecture." />
  <meta property="og:image" content="https://onnrev.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@onnrev" />
  <meta name="twitter:title" content="ONNREV — Building What Moves Tomorrow." />
  <meta name="twitter:description"
    content="Technology, design and solutions built for businesses ready for what's next." />
  <meta name="twitter:image" content="https://onnrev.com/og-image.png" />

  <!-- Font Performance: preconnect before stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ONNREV",
      "url": "https://onnrev.com",
      "logo": "https://onnrev.com/favicon.svg",
      "description": "Premium Corporate Technology Company — Intelligent Systems, Digital Experiences & Business Solutions",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contact@onnrev.com",
        "contactType": "Corporate Inquiries"
      },
      "sameAs": [
        "https://linkedin.com/company/onnrev"
      ]
    }
  </script>

  <!-- Structured Data: WebSite -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ONNREV",
      "url": "https://onnrev.com"
    }
  </script>
</head>

<body class="bg-black text-white antialiased selection:bg-[#ef233c] selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
