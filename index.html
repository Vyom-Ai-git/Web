<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>ONNREV — Enterprise Systems Architecture & Autonomous Intelligence</title>
  <meta name="description"
    content="ONNREV designs resilient digital infrastructure, autonomous business operations, and growth architecture for modern enterprises. Engineering systems, not just software." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://onnrev.com/" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#0B0D13" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://onnrev.com/" />
  <meta property="og:site_name" content="ONNREV" />
  <meta property="og:title" content="ONNREV — Enterprise Systems Architecture & Autonomous Intelligence" />
  <meta property="og:description"
    content="We design intelligent infrastructure, autonomous systems, and growth architecture for modern enterprises. Engineering systems, not just software." />
  <meta property="og:image" content="https://onnrev.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@onnrev" />
  <meta name="twitter:title" content="ONNREV — Enterprise Systems Architecture & Autonomous Intelligence" />
  <meta name="twitter:description"
    content="Intelligent infrastructure, autonomous systems, and growth architecture for modern enterprises." />
  <meta name="twitter:image" content="https://onnrev.com/og-image.png" />

  <!-- Font Performance: preconnect before stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ONNREV",
      "url": "https://onnrev.com",
      "logo": "https://onnrev.com/favicon.svg",
      "description": "Enterprise Systems Architecture & Autonomous Intelligence Studio",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contact@onnrev.com",
        "contactType": "Customer Support"
      },
      "sameAs": [
        "https://linkedin.com/company/onnrev"
      ]
    }
  </script>

  <!-- Structured Data: WebSite -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ONNREV",
      "url": "https://onnrev.com"
    }
  </script>
</head>

<body class="bg-[#F6F7F9] text-[#0B0D13] antialiased selection:bg-[#10B981]/20 selection:text-[#0B0D13]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
