<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Vyom — Enterprise AI & Business Transformation Studio</title>
  <meta name="description"
    content="Vyom designs intelligent infrastructure, autonomous business systems, growth architecture, and digital experiences for modern enterprises. Let's engineer what's next." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://Vyom.ai/" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#EDEEF5" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://Vyom.ai/" />
  <meta property="og:site_name" content="Vyom" />
  <meta property="og:title" content="Vyom — Enterprise AI & Business Transformation Studio" />
  <meta property="og:description"
    content="We design intelligent infrastructure, autonomous systems, and growth architecture for modern enterprises. Start a conversation today." />
  <meta property="og:image" content="https://Vyom.ai/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Vyomi" />
  <meta name="twitter:title" content="Vyom — Enterprise AI & Business Transformation Studio" />
  <meta name="twitter:description"
    content="Intelligent infrastructure, autonomous systems, and growth architecture for modern enterprises." />
  <meta name="twitter:image" content="https://Vyom.ai/og-image.png" />

  <!-- Font Performance: preconnect before stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Vyom",
      "url": "https://Vyom.ai",
      "description": "Enterprise AI & Business Transformation Studio",
      "sameAs": [
        "https://linkedin.com/company/Vyomi"
      ]
    }
    </script>

  <!-- Structured Data: WebSite -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Vyom",
      "url": "https://Vyom.ai"
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
